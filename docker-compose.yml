services:
  # Banco vetorial — armazena documentos, chunks e embeddings (pgvector)
  db-vector:
    image: pgvector/pgvector:pg16
    container_name: rag-db-vector
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragdb
    ports:
      - "5433:5432"
    volumes:
      - vector_data:/var/lib/postgresql/data
      - ./init-db-vector:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Banco de usuários — contas, sessões de chat e histórico de mensagens
  db-users:
    image: postgres:16
    container_name: rag-db-users
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: usersdb
    ports:
      - "5434:5432"
    volumes:
      - users_data:/var/lib/postgresql/data
      - ./init-db-users:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usersdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplicação RAG — ETL, chat CLI e API web (imagem construída pelo Dockerfile)
  app:
    build:
      context: .
      args:
        PYTHON_VERSION: "3.12"
    image: rag-producao:latest
    container_name: rag-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro da rede do Compose os bancos atendem pelo nome do serviço na
      # porta 5432 — isto sobrescreve os localhost:5433/5434 do .env, que
      # continuam valendo para quem roda fora do Docker.
      RAGDB_URL: postgresql://postgres:postgres@db-vector:5432/ragdb
      USERSDB_URL: postgresql://postgres:postgres@db-users:5432/usersdb
    ports:
      - "8000:8000"
    volumes:
      # Cache dos modelos de embedding: sobrevive a rebuilds da imagem
      - hf_cache:/opt/hf-cache
    depends_on:
      db-vector:
        condition: service_healthy
      db-users:
        condition: service_healthy

  # Adminer — UI web simples para inspecionar os dois bancos (opcional)
  adminer:
    image: adminer
    container_name: rag-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db-vector
      - db-users

volumes:
  vector_data:
  users_data:
  hf_cache:
