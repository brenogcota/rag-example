<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f6f7f9;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --text: #111827;
    --muted: #6b7280;
    --accent: #2563eb;
    --user-bubble: #2563eb;
    --bot-bubble: #f3f4f6;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: grid;
    place-items: center;
    padding: 24px;
  }

  /* ---------- painel do chat (único elemento da página) ---------- */
  .widget {
    width: 420px; max-width: 100%;
    height: min(680px, calc(100vh - 48px));
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 12px 32px rgba(16,24,40,.08);
    display: flex; flex-direction: column; overflow: hidden;
  }

  .head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; border-bottom: 1px solid var(--border);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; flex: none; }
  .head .sub { font-size: 12px; color: var(--muted); }
  .head .spacer { flex: 1; }
  .icon-btn {
    background: transparent; border: none; color: var(--muted);
    cursor: pointer; font-size: 17px; line-height: 1; padding: 6px; border-radius: 8px;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }

  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }

  .msg { max-width: 86%; display: flex; flex-direction: column; gap: 6px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot  { align-self: flex-start; }
  .bubble {
    padding: 10px 13px; border-radius: var(--radius);
    font-size: 14px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot  .bubble { background: var(--bot-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.error .bubble { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }

  .sources { display: flex; flex-wrap: wrap; gap: 6px; }
  .source {
    font-size: 11px; color: var(--muted); text-decoration: none;
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 3px 8px; border-radius: 999px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .source:hover { color: var(--text); border-color: var(--border-strong); }

  .typing { display: inline-flex; gap: 4px; align-items: center; height: 18px; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .composer { border-top: 1px solid var(--border); padding: 12px; display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea {
    flex: 1; resize: none; border-radius: 12px; padding: 10px 12px;
    background: var(--surface); border: 1px solid var(--border-strong); color: var(--text);
    font: inherit; font-size: 14px; line-height: 1.4; max-height: 120px; outline: none;
  }
  .composer textarea::placeholder { color: #9ca3af; }
  .composer textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .send {
    flex: none; width: 40px; height: 40px; border-radius: 12px; border: none; cursor: pointer;
    background: var(--accent); color: #fff; display: grid; place-items: center;
  }
  .send:disabled { opacity: .4; cursor: not-allowed; }

  /* Em telas pequenas o chat ocupa a viewport inteira */
  @media (max-width: 480px) {
    body { padding: 0; }
    .widget { height: 100vh; border: none; border-radius: 0; box-shadow: none; }
  }
</style>
</head>
<body>

<section class="widget" id="widget" aria-label="Chat">
  <header class="head">
    <span class="dot" id="status-dot"></span>
    <span class="sub" id="status-text">pronto</span>
    <div class="spacer"></div>
    <button class="icon-btn" id="reset" title="Nova conversa" aria-label="Nova conversa">⟳</button>
  </header>

  <div class="messages" id="messages"></div>

  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Pergunte algo sobre a base…" autocomplete="off"></textarea>
    <button class="send" id="send" type="submit" title="Enviar" aria-label="Enviar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </form>
</section>

<script>
(function () {
  const API = "/stream";
  const USERNAME = "web.user";

  const el = {
    messages: document.getElementById("messages"),
    composer: document.getElementById("composer"),
    input: document.getElementById("input"),
    send: document.getElementById("send"),
    reset: document.getElementById("reset"),
    statusText: document.getElementById("status-text"),
    statusDot: document.getElementById("status-dot"),
  };

  let sessionId = null;
  let busy = false;

  // ---------- UI helpers ----------
  function setStatus(text, ok = true) {
    el.statusText.textContent = text;
    el.statusDot.style.background = ok ? "#16a34a" : "#dc2626";
  }
  function scrollToEnd() {
    el.messages.scrollTop = el.messages.scrollHeight;
  }

  function addBubble(kind, text) {
    const msg = document.createElement("div");
    msg.className = "msg " + kind;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text || "";
    msg.appendChild(bubble);
    el.messages.appendChild(msg);
    scrollToEnd();
    return { msg, bubble };
  }

  function addTyping() {
    const { msg, bubble } = addBubble("bot", "");
    bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    return { msg, bubble };
  }

  function renderSources(msgEl, sources) {
    if (!sources || !sources.length) return;
    const box = document.createElement("div");
    box.className = "sources";
    for (const s of sources) {
      const a = document.createElement("a");
      a.className = "source";
      a.href = s.source_url;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = `${s.title} · ${(s.similarity * 100).toFixed(0)}%`;
      a.title = s.source_url;
      box.appendChild(a);
    }
    msgEl.appendChild(box);
    scrollToEnd();
  }

  // ---------- parser de SSE sobre fetch/ReadableStream ----------
  // EventSource só faz GET; usamos fetch + POST e decodificamos os frames
  // `event: <nome>\ndata: <json>\n\n` na mão.
  async function* readSSE(response) {
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let sep;
      while ((sep = buffer.indexOf("\n\n")) !== -1) {
        const frame = buffer.slice(0, sep);
        buffer = buffer.slice(sep + 2);

        let event = "message";
        const dataLines = [];
        for (const line of frame.split("\n")) {
          if (line.startsWith("event:")) event = line.slice(6).trim();
          else if (line.startsWith("data:")) dataLines.push(line.slice(5).trim());
        }
        if (!dataLines.length) continue;
        try {
          yield { event, data: JSON.parse(dataLines.join("\n")) };
        } catch (_) { /* frame incompleto ou keep-alive: ignora */ }
      }
    }
  }

  // ---------- envio ----------
  async function send(text) {
    if (busy || !text.trim()) return;
    busy = true;
    el.send.disabled = true;
    setStatus("pensando…");

    addBubble("user", text);
    const pending = addTyping();
    let answer = "";

    try {
      const response = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, username: USERNAME, session_id: sessionId }),
      });

      if (!response.ok || !response.body) {
        throw new Error(`HTTP ${response.status}`);
      }

      for await (const { event, data } of readSSE(response)) {
        if (event === "session") {
          sessionId = data.session_id;
        } else if (event === "sources") {
          renderSources(pending.msg, data.sources);
          setStatus(data.sources.length ? `${data.sources.length} trechos recuperados` : "sem contexto relevante");
        } else if (event === "token") {
          answer += data.text;
          pending.bubble.textContent = answer;
          scrollToEnd();
        } else if (event === "done") {
          setStatus("pronto");
        } else if (event === "error") {
          throw new Error(data.message);
        }
      }

      if (!answer) pending.bubble.textContent = "(resposta vazia)";
    } catch (err) {
      pending.msg.className = "msg bot error";
      pending.bubble.textContent = "Erro: " + err.message;
      setStatus("falhou", false);
    } finally {
      busy = false;
      el.send.disabled = false;
      el.input.focus();
    }
  }

  // ---------- eventos ----------
  el.reset.addEventListener("click", () => {
    sessionId = null;
    el.messages.innerHTML = "";
    setStatus("nova conversa");
    el.input.focus();
  });

  el.composer.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = el.input.value;
    el.input.value = "";
    el.input.style.height = "auto";
    send(text);
  });

  el.input.addEventListener("input", () => {
    el.input.style.height = "auto";
    el.input.style.height = Math.min(el.input.scrollHeight, 120) + "px";
  });

  el.input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      el.composer.requestSubmit();
    }
  });

  el.input.focus();
})();
</script>
</body>
</html>
